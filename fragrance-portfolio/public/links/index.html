<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151f">
  <meta name="description" content="Connect with Ninad Rade — MS Computer Engineering | AI/ML. LinkedIn, resume, and Instagram.">
  <title>Ninad Rade · Links</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #10151f;
      --ink: #f2f5fa;
      --muted: #aebbcf;
      --ice: #bddeed;
      --lavender: #a8a4ce;
      --line: #ffffff24;
    }
    * { box-sizing: border-box; }
    html { min-width: 280px; background: var(--night); }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 48px 20px;
      padding-top: max(48px, env(safe-area-inset-top));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(ellipse at 10% 10%, #44607455, transparent 48%),
        radial-gradient(ellipse at 95% 85%, #51476645, transparent 48%),
        var(--night);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(#ffffff03 1px, transparent 1px), linear-gradient(90deg, #ffffff03 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: linear-gradient(to bottom, #000, transparent 90%);
    }
    main { width: min(100%, 420px); position: relative; }
    header { text-align: center; padding: 0 0 32px; }
    .monogram {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      margin: 0 auto 26px;
      position: relative;
      isolation: isolate;
      border: 1px solid #d8ecff40;
      border-radius: 27px;
      background: linear-gradient(145deg, #daeefe24, #ffffff05 70%);
      box-shadow: inset 0 1px 0 #ffffff30, 0 16px 45px #00000030;
      color: var(--ice);
      font: italic 36px Georgia, "Times New Roman", serif;
      letter-spacing: -5px;
      padding-right: 5px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .monogram::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: -8px;
      border-radius: 32px;
      border: 1px solid #bdddff14;
      transform: rotate(-12deg);
    }
    h1 { margin: 0 0 10px; font-family: "Trebuchet MS", sans-serif; font-size: clamp(32px, 8vw, 38px); font-weight: 600; letter-spacing: -1.5px; line-height: 1.15; }
    .subtitle { color: var(--muted); font-size: 14px; line-height: 1.65; margin: 0; }
    .divider { width: 32px; height: 1px; background: linear-gradient(90deg, var(--ice), var(--lavender)); margin: 24px auto 0; }
    nav { display: grid; gap: 12px; }
    .link {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 82px;
      padding: 17px 20px;
      text-decoration: none;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(120deg, #ffffff0e, #ffffff05);
      box-shadow: inset 0 1px 0 #ffffff08, 0 5px 20px #0000000c;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: transform .2s ease, border-color .2s ease, background-color .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: #bddeed20;
    }
    .icon { flex: 0 0 24px; width: 24px; height: 24px; color: var(--ice); }
    .text { flex: 1; min-width: 0; }
    .label { display: block; font-size: 16px; font-weight: 600; letter-spacing: -.2px; }
    .detail { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .arrow { width: 18px; height: 18px; color: var(--muted); transition: transform .2s ease, color .2s ease; flex-shrink: 0; }
    .link:focus-visible { outline: 2px solid var(--ice); outline-offset: 5px; background-color: #bddeed12; }
    .link:active { transform: scale(.985); }
    @media (hover: hover) {
      .link:hover { transform: translateY(-3px); border-color: #bddeed60; background-color: #bddeed0a; box-shadow: inset 0 1px 0 #ffffff15, 0 10px 28px #00000020; }
      .link:hover .arrow { transform: translate(2px, -2px); color: var(--ice); }
    }
    footer { margin-top: 30px; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; }
    footer span { color: var(--ice); margin: 0 6px; }
    @media (max-width: 340px) { body { padding-inline: 14px; } .link { padding-inline: 16px; gap: 12px; } .subtitle { font-size: 12px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; } .link:hover, .link:active, .link:hover .arrow { transform: none; } }
    @supports not (backdrop-filter: blur(1px)) { .link, .monogram { background-color: #1b2230; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="monogram" aria-hidden="true">NR</div>
      <h1>Ninad Rade</h1>
      <p class="subtitle">MS Computer Engineering | AI/ML</p>
      <div class="divider" aria-hidden="true"></div>
    </header>
    <nav aria-label="Connect with Ninad">
      <a class="link" href="https://www.linkedin.com/in/ninadrade/" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7.5 10v7M11.5 17v-7m0 3a3 3 0 0 1 6 0v4"/><circle cx="7.5" cy="7" r=".8" fill="currentColor" stroke="none"/></svg>
        <span class="text"><span class="label">LinkedIn</span><span class="detail">Experience, ideas &amp; connections</span></span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg>
      </a>
      <a class="link" href="https://ninadrade.xyz/assets/Ninad_Rade_Resume.pdf" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8Zm0 0v5h5M8 12h8M8 16h6"/></svg>
        <span class="text"><span class="label">Resume</span><span class="detail">My work, projects &amp; background</span></span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg>
      </a>
      <a class="link" href="https://www.instagram.com/radeninad/" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        <span class="text"><span class="label">Instagram</span><span class="detail">A little beyond the screen</span></span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg>
      </a>
    </nav>
    <footer>Let's connect <span aria-hidden="true">↗</span></footer>
  </main>
</body>
</html>
